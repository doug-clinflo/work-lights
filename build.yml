name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app and run offline checks
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Work-Lights-macOS
          path: dist/
